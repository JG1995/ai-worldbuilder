name: Release

# Version tags build installers into a draft release. A manual run on a branch
# builds the same installers as workflow artifacts without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # Needed to create the draft release; manual runs on a branch make no release calls.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    # This job can write releases, so third-party actions run at a pinned commit that a moved tag
    # cannot change, and the build compiles from scratch rather than from a cache another run saved.
    steps:
      - uses: actions/checkout@v7

      # Runs before anything else so a mismatched tag never reaches tauri-action.
      - name: Check tag matches version
        if: github.ref_type == 'tag'
        shell: bash
        run: bash .github/scripts/check-release-tag.sh

      - name: Install Tauri Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - run: pnpm install --frozen-lockfile

      - name: Build draft release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Grimoire.md v__VERSION__
          releaseDraft: true
          prerelease: false

      # Without tagName, releaseName or releaseId, tauri-action creates no release.
      - name: Build installers
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          uploadWorkflowArtifacts: true
