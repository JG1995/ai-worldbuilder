[package]
name = "grimoire"
version = "0.1.0"
description = "Grimoire.md desktop application"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grimoire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
similar = "^3.2.1"
tauri-plugin-single-instance = "^2.5.5"
notify = "^8.2.1"
notify-debouncer-full = "^0.7.0"
rusqlite = { version = "^0.41.1", features = ["bundled"] }
pulldown-cmark = { version = "0.13", default-features = false }
yaml-rust2 = { version = "0.13", default-features = false }
unicode-normalization = "0.1"
url = "2"
percent-encoding = "2"
# `hardened` refuses every address that is not http or https, behind `web.rs`'s own check.
webbrowser = { version = "1", features = ["hardened"] }
keyring-core = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Only to recognise a failed secure connection in `reqwest`'s errors; `reqwest` picks its features.
rustls = { version = "0.23", default-features = false }
# Decodes the image provider's base64 images, and encodes a regeneration's reference.
base64 = "0.23.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "^0.9.12"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
tempfile = "3"
ts-rs = "12.0.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# No `panic = "abort"`: `error::guard` needs unwinding to turn a command panic into an error.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
